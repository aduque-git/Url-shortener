name: CI

# Define cuándo se ejecuta el workflow.
# push: cuando se sube código a main.
# pull_request: cuando se crea o actualiza un Pull Request hacia main.
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


# Permisos que tendrá el workflow sobre el repositorio.
# Es recomendable conceder únicamente los permisos necesarios.
permissions:
  contents: read


jobs:

  # Un job es un conjunto de pasos que se ejecutan en el mismo runner.
  build:
    name: Build and verify

    # Máquina virtual proporcionada por GitHub sobre Ubuntu.
    runs-on: ubuntu-latest

    steps:

      # Obtiene el código del repositorio en el runner.
      - name: Checkout repository
        uses: actions/checkout@v4


      # Instala y configura la versión de Java indicada.
      # La distribución Temurin proporciona una distribución OpenJDK.
      # cache: maven reutiliza dependencias descargadas entre ejecuciones.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven


      # En runners Linux, el Maven Wrapper necesita permiso de ejecución.
      - name: Make Maven Wrapper executable
        run: chmod +x mvnw


      # Ejecuta el lifecycle de Maven hasta la fase verify.
      # Si Maven devuelve un código distinto de 0, el job falla.
      - name: Build and verify
        run: ./mvnw clean verify
